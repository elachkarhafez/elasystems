<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Templates · ElaSystems</title>
<meta name="description" content="Website templates ElaSystems built for local businesses: barbers, restaurants, salons, gyms and more. Every one is live: tap it and play with it.">
<link rel="canonical" href="https://elasystems.com/templates/">
<meta name="theme-color" content="#0b1020">
<style>
  :root { --bg:#0b1020; --panel:#121a33; --ink:#eef1f8; --muted:#9aa4c0; --gold:#e3b341; --pad:clamp(16px,4vw,56px); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:clamp(40px,8vw,96px) var(--pad) 24px; max-width:1280px; margin:0 auto; }
  header a.home { color:var(--gold); text-decoration:none; font-weight:600; }
  h1 { font-size:clamp(32px,6vw,64px); line-height:1.05; margin:16px 0 8px; letter-spacing:-0.02em; }
  header p { color:var(--muted); max-width:56ch; margin:0; }
  ul { list-style:none; margin:0 auto; padding:24px var(--pad) 64px; max-width:1280px; display:grid; gap:20px; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); }
  .card a { display:block; background:var(--panel); border-radius:14px; overflow:hidden; color:inherit; text-decoration:none; outline-offset:3px; transition:transform .25s ease; }
  .card a:hover { transform:translateY(-3px); }
  .card a:focus-visible { outline:2px solid var(--gold); }
  .card img { display:block; width:100%; height:auto; aspect-ratio:16/10; object-fit:cover; background:#0003; }
  .meta { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:14px 16px; }
  .meta small { color:var(--muted); }
  footer { text-align:center; color:var(--muted); padding:0 var(--pad) 48px; }
  footer a { color:var(--gold); }
  @media (prefers-reduced-motion: reduce) { .card a { transition:none; } .card a:hover { transform:none; } }
</style>
</head>
<body>
<header>
  <a class="home" href="/">← ElaSystems</a>
  <h1>Templates</h1>
  <p>1 website we built for local trades. Every one is live: tap one and play with it. Want one for your business? Text <a href="sms:+13133006898" style="color:var(--gold)">313-300-6898</a>.</p>
</header>
<main>
  <ul>
    <li class="card">
      <a href="/sites/the-tin-chair/" target="_blank" rel="noopener">
        <picture>
          <source media="(max-width: 640px)" srcset="/templates/media/the-tin-chair-m.jpg">
          <img src="/templates/media/the-tin-chair-d.jpg" alt="The Tin Chair, a barbershop website template" loading="lazy" width="1440" height="900">
        </picture>
        <span class="meta"><b>The Tin Chair</b><small>Barbershop</small></span>
      </a>
    </li>
  </ul>
</main>
<footer>Concept sites with fictional names. Built by <a href="/">ElaSystems</a>.</footer>
</body>
</html>
